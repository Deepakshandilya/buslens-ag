server {
    listen 80;
    listen [::]:80;
    
    # Replace with your domain name (e.g. buslens.com) once you purchase one.
    # Otherwise, Nginx will accept incoming traffic from the Elastic IP
    server_name _;

    # Logs
    access_log /var/log/nginx/buslens.access.log;
    error_log /var/log/nginx/buslens.error.log;

    # 1. Frontend Route (Next.js)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Backend API Route (FastAPI)
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
