name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:           
      name: production     
      url: https://buslens.live  

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/buslens-ag
            git fetch origin
            git reset --hard origin/main

            # BACKEND
            cd ~/buslens-ag/backend
            /home/ubuntu/buslens-ag/venv/bin/pip install -r requirements.txt

            # restart service WITHOUT sudo prompt issue
            sudo systemctl restart fastapi || echo "restart failed"
            sudo systemctl reload nginx
