name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:           
      name: production     
      url: https://buslens.live  

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/buslens-ag
            git pull origin main

            # FRONTEND
            cd frontend
            npm install
            npm run build
            pm2 restart nextjs || pm2 start npm --name "nextjs" -- start

            # BACKEND
            cd ~/buslens-ag/backend
            /home/ubuntu/buslens-ag/venv/bin/pip install -r requirements.txt

            # restart service WITHOUT sudo prompt issue
            sudo systemctl restart fastapi || echo "restart failed"
