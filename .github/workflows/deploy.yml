name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:           
      name: production     
      url: https://buslens.live  

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/buslens-ag
            git fetch origin main
            git reset --hard origin/main
            echo "Deploying commit $(git rev-parse --short HEAD)"

            # FRONTEND
            cd frontend
            npm ci
            npm run build
            pm2 delete nextjs || true
            pm2 start npm --name "nextjs" --cwd /home/ubuntu/buslens-ag/frontend -- start
            pm2 save

            # BACKEND
            cd ~/buslens-ag/backend
            /home/ubuntu/buslens-ag/backend/venv/bin/pip install -r requirements.txt

            # restart service WITHOUT sudo prompt issue
            sudo systemctl restart fastapi
